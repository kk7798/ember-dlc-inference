schemaVersion: 1.0.1

application:
  name: EMBER DeepLabCut Inference
  description: Run DeepLabCut inference on one test image using a trained EMBER model.
  version: 1.0.1
  tags:
    - DeepLabCut
    - EMBER
    - inference

runtime:
  cpu: 4096
  memory: 16384
  computeTypes:
    - standard
  timeoutSeconds: 86400
  
parameters:
- name: SINGLE_IMAGE
  type: string
  defaultValue: 'true'
- name: MODEL_DIR
  type: string
  defaultValue: ""
- name: DATA_DIR
  type: string
  defaultValue: ""
- name: CHECKPOINT_POLICY
  type: string
  defaultValue: best-validation
- name: DEVICE
  type: string
  defaultValue: cpu
- name: SHUFFLE
  type: number
  defaultValue: '1'
- name: TRAININGSET_INDEX
  type: number
  defaultValue: '0'
- name: SNAPSHOT_INDEX
  type: number
  defaultValue: '-1'
- name: DETECTOR_SNAPSHOT_INDEX
  type: number
  defaultValue: '-1'
- name: BATCH_SIZE
  type: number
  defaultValue: '1'
- name: CPU_THREADS
  type: number
  defaultValue: '4'
- name: PCUTOFF
  type: number
  defaultValue: '0.6'
- name: PCK_PIXELS
  type: number
  defaultValue: '10'
- name: PLOT_IMAGES
  type: string
  defaultValue: 'false'
  
inputs:
  - name: inference_bundle
    description: Trained DLC project and test images downloaded from EMBER DANDI.
    required: true
    mediaTypes:
      - application/octet-stream

outputs:
  - name: inference_results
    description: Predictions, evaluation metrics, image overlays, and run metadata.
    required: true
    mediaTypes:
      - application/octet-stream
